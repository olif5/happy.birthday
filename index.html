  <head>

  </head>
  <style>
    :root {
      --warna-bg: rgba(0, 0, 0, 0.7);
      --warna-teks: white;
      --bingkai: 14px;
      --warna-bingkai: rgba(255, 255, 255, 0.8);
      --gaya-font: "Josefin Sans", sans-serif;
      --gaya-font2: "Ubuntu", sans-serif;
    }
    body {
      background-color: #101010;
      font-family: var(--gaya-font);
      padding: 25px;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    a {
      text-decoration: none;
    }

    #bodyblur {
      opacity: 1;
      animation: jj 7s infinite;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: -1;
      transition: all 1s ease;
    }
    #wallpaper {
      transition: all 3s ease;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #beneranblur {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      transition: all 3s ease;
    }
    @keyframes jj {
      0% {
        transform: scale(1.1);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1.1);
      }
    }

    @keyframes leaves {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(0.8);
      }
    }
    #lope,
    .lopdeg {
      animation: leaves 1s ease-in-out infinite alternate;
      -webkit-animation: leaves 1s ease-in-out infinite alternate;
    }
    .lovein:hover {
      transform: scale(1.3);
    }

    @keyframes kont {
      0% {
        left: -1px;
        top: -3px;
      }
      50% {
        left: 1px;
        top: 3px;
      }
      100% {
        left: -1px;
        top: -3px;
      }
    }
    blockquote {
      opacity: 0;
      visibility: hidden;
      transition: all 1s ease;
      position: relative;
      margin-top: 120px;
      margin-left: 0;
      margin-right: 0;
    }
    blockquote {
      width: 400px;
      background: var(--warna-bg);
      color: var(--warna-teks);
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0px 2px 2px rgba(0, 0, 0, 0.8);
      text-align: center;
      line-height: 1.3em;
      padding: 16px 35px 16px 35px;
      border: 1px solid var(--warna-teks);
      border-radius: var(--bingkai);
    }
    blockquote p:first-child {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    #katabawah {
      font-size: 15px;
    }
    p {
      margin: 1.5em 0;
      transition: all 0.3s ease;
    }
    #bq img {
      display: none;
      width: 160px;
      height: 160px;
      margin: 20px 0 0 0;
    }
    #fotolove {
      opacity: 0;
      visibility: hidden;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    #fotolove:hover {
      transform: scale(0.8);
    }
    #akhiran {
      display: none;
      color: #ffa300;
      font-size: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      text-shadow: 0px;
      padding: 10px;
      border-radius: var(--bingkai);
      line-height: 10px;
      transition: all 0.2s ease;
    }
    #akhiran:hover {
      transform: scale(0.9);
      opacity: 0.5;
    }

    #pergeseran {
      opacity: 0;
      visibility: hidden;
      transition: all 2s ease;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      max-width: 500px;
      padding: 30px 20px;
      overflow-y: hidden;
      overflow-x: scroll;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    #pergeseran::-webkit-scrollbar { display: none; }

    #pergeseran p {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--warna-teks);
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5em;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 85%;
      min-height: 200px;
      margin: 0 15px 0 0;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
    }
    #pergeseran p:hover {
      transform: translateY(-5px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.15);
    }
    #pergeseran p b img {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    }
    #pergeseran > *:last-child {
      margin-right: 0;
    }
    #pergeseran:after {
      content: "";
      display: block;
      flex-shrink: 0;
      align-self: stretch;
      padding-left: 20px;
    }
    #pergeseran p b {
      display: block;
    }
    #pergeseran p b img {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    #tm {
      width: 100px;
      color: #ffb400;
      transition: all 0.5s ease;
    }
    #tm:hover {
      transform: scale(0.7);
    }
    #idgeser,
    #idkalimat,
    #palingakhir {
      position: relative;
      opacity: 0.9;
      font-size: 16px;
      line-height: 1.4em;
      color: var(--warna-teks);
      text-align: center;
      text-shadow: 0px 2px 2px rgba(0, 0, 0, 0.8);
      transition: all 1s ease;
    }
    #idkalimat,
    #palingakhir {
      opacity: 0;
      transform: scale(0.1);
    }
    #imglewat {
      opacity: 0;
      max-width: 520px;
      height: 0;
      position: relative;
      z-index: -1;
      transition: all 1s ease;
    }
    #idkalimat {
      font-weight: 700;
    }
    #palingakhir {
      width: 300px;
      margin: 0 50px;
    }

    .lovein {
      font-size: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .lovein svg {
      width: 80px;
      height: 80px;
      fill: #fefefe;
    }

    .content2 {
      display: block;
      text-align: center;
      width: 100%;
      height: 180px;
      margin-top: 50px;
    }
    .content2 > * {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      font-size: 17px;
      color: white;
    }
    .image img {
      border-radius: 10%;
      transform: scale(0.1);
      transition: all 0.8s ease;
    }
    #k2 .image > * {
      margin-bottom: 40px;
    }
    #k2 {
      font-weight: 700;
      font-size: 17px;
      color: white;
      text-shadow: 0px 2px 2px rgba(0, 0, 0, 0.8);
    }
    #final1 {
      transition: all 3s ease;
    }

    .content2 {
      display: none;
    }
    #Content,
    #k2 {
      animation: none 3s infinite;
      position: relative;
      opacity: 0;
      width: 100%;
      height: 180px;
      transition: all 1.2s ease;
    }
    #Content > *,
    #k2 > * {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }
    #k2,
    #final1 {
      transform: scale(0.4);
    }

    #Tombol {
      position: relative;
      opacity: 0;
      margin: 0;
      margin-top: -100px;
      display: flex;
      align-items: left;
      list-style: none;
      transform: scale(0.1);
      transition: all 1s ease;
    }
    #Tombol a {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      margin: 12px 0;
      transition: all 0.3s ease;
      padding: 12px 30px;
      outline: 0;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: var(--warna-teks);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    #Tombol a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1) translateY(-3px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
      opacity: 1;
    }

    .swal2-title {
      margin-right: 20px;
      margin-left: 20px;
      font-size: 22px;
      text-align: center;
      padding: 15px 30px 0 30px;
    }
    .swal2-modal {
      background: rgba(255, 255, 255, 0.99);
      border: 0.7px solid #000;
      border-radius: var(--bingkai);
      top: -60px;
    }

    .fa-heart {
      opacity: 0.4;
      color: white;
      font-size: 20px;
      position: absolute;
      animation: heartMove linear 1;
      top: -10vh;
      z-index: 0;
    }
    @keyframes heartMove {
      0% {
        transform: translateY(-10vh);
      }
      100% {
        transform: translateY(100vh);
      }
    }


    :active,
    :focus {
      outline: 0;
    }

    /* Styles for Pesan Content (Merged) */
    #PesanContent {
      display: none;
      font-family: var(--gaya-font2);
    }
    #PesanContent blockquote {
      width: 90%;
      max-width: 450px;
      background: rgba(0, 0, 0, .75);
      color: white;
      padding: 15px 20px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 10px;
      margin: 20px auto 0 auto;
      font-size: 14px;
    }
    #PesanContent p {
      font-size: 15px;
    }
    #PesanContent #suratin img {
      display: inline-flex;
      background: rgba(255, 255, 255, 1);
      border-radius: 10%;
      padding: 10px;
      width: 140px;
      height: 110px;
      transition: all .3s ease;
    }
    #PesanContent #suratin img:hover { transform: scale(.9); }
    #PesanContent #ket { margin-top: 30px; color: white; font-weight: 700; }
    #PesanContent #Tombol2 {
      opacity: 0; margin-top: 15px; display: flex; list-style: none; transform: scale(.1); transition: all 1s ease; justify-content: center; align-items: center;
    }
    #PesanContent #Tombol2 a {
      cursor: pointer;
      padding: 12px 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    #PesanContent #Tombol2 a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1) translateY(-3px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
    }
    #Content2 {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
    }
    .kumpulanstiker > img { display: none; }

    /* Responsivitas untuk Mobile */
    @media screen and (max-width: 600px) {
      blockquote, #PesanContent blockquote {
        width: 85%;
        padding: 15px 20px;
        margin-top: 50px;
        font-size: 16px;
      }
      #pergeseran {
        max-width: 100%;
        padding: 20px 10px;
      }
      #pergeseran p {
        width: 90%;
        min-height: 150px;
        font-size: 14px;
      }
      #imglewat {
        max-width: 90%;
      }
      #palingakhir {
        width: 80%;
        margin: 0 auto;
      }
      #Tombol {
        margin-top: 20px;
      }
      #Content, #k2 {
        height: auto;
      }
      #Content2 {
        margin-top: 5vh !important;
      }
      #PesanContent blockquote {
        margin: 5px auto 0 auto;
        width: 95%;
        padding: 8px 12px;
      }
      #PesanContent blockquote p {
        font-size: 12px;
        line-height: 1.3em;
        margin: 5px 0;
      }
    }
  </style>
  <body>

          <a onClick="multifungsi()">

    <!-- Pesan Page Content (Merged) -->
    <div id="PesanContent">
      <div class="kumpulanstiker">
        <img src="img/bunga (1).gif" id="fotoakhir1"/>
        <img src="img/mndkat (1).gif" id="fotoakhir2"/>
        <img src="img/cartoons.gif" id="fotoakhir3"/>
        <img src="img/tinju.gif" id="fotoakhir4"/>
      </div>
      <div id="Content2" style="position:relative; opacity:0; margin-top:50px; width:100%; transition:all 1.3s ease;">
        <div id="suratin" onClick="audio.play(); memulai2();">
          <img src="img/envelope.png"/>
        </div>
        <p id="ket">Klik Suratnya!</p>
        <div><img src="img/tos.gif" id="fotoakhir" style="display:none; width:80px; height:80px; border-radius:50%; background:white; padding:8px; margin:5px auto;" /></div>
        <div><blockquote id="bq2">
          <p id="kalimat2"></p>
          <p id="kalimatc"></p>
        </blockquote></div>
        <div id="Tombol2">
          <a onClick="sjawab2()"><b>Selesai</b></a>

    <script>
      // Common variables
      const body = document.querySelector("body");
      const swals = Swal.mixin({ allowOutsideClick: false, cancelButtonColor: "#FF0040" });
      const swalst = Swal.mixin({ allowOutsideClick: false, showConfirmButton: false, timer: 1000, timerProgressBar: true });
      const swalst2 = Swal.mixin({ allowOutsideClick: false, showConfirmButton: false, timer: 3300, timerProgressBar: true, imageWidth: 100, imageHeight: 100 });

      // Index variables
      let ftom = 0;
      let jikapr = 1;
      let aa = 0;
      let akhirkata = "";
      let akhirkata2 = "";

      // Index functions
      function nongeser() {
        tombol();
        idgeser.style = "transform: scale(.1);opacity:0;";
        fotolove.style = "opacity:1;visibility:visible";
      }
      function showDiv() {
        setTimeout(kpemb, 100);
        setTimeout(nongeser, 1000);
        document.getElementById("Content").style = "opacity:1;margin-top:10vh;animation:none 3s infinite;";
        document.getElementById("pergeseran").style = "opacity:1;visibility:visible;";
      }
      function showAkhir() {
        setInterval(createHeart, 200);
        // document.getElementById("k2").style = "opacity:1;transform:scale(1);margin:0;"; // Removed as it conflicts
        document.getElementById("Content").style.display = "none";
      }
      function mulaiakhir() {
        setTimeout(showAkhir, 500);
        setTimeout(finalis, 600);
      }
      function tombol() {
        if (pergeseran.style.display == "none") {
          ftom = 50;
          tmbl.innerHTML = "Lanjut";
          Tombol.style = "margin-top:30px;opacity:1;transform: scale(1)";
          tmbl.style = "font-size:12px";
        } else {
          ftom = 1;
          jikapr += 1;
          Tombol.style = "opacity:1;transform: scale(1);";
        }
      }
      function multifungsi() {
        if (ftom == 1) {
          document.getElementById("pergeseran").scrollLeft += 300;
          hsementara();
        }
        if (ftom == 50) {
          switchView();
        }
      }
      function hsementara() {
        Tombol.style = "opacity:0;transform: scale(.1);";
        ftom = 0;
        if (jikapr <= 5) {
          setTimeout(tombol, 600);
        }
      }
      function kpemb() {
        document.getElementById("bodyblur").style = "opacity:.7;";
      }
      function finalis() {
        // Updated to use unique ID
        const bq = document.getElementById("bq");
        if(bq) bq.style = "opacity:1;visibility:visible;margin-top:0";
        // setTimeout(showTom, 4000); // showTom not defined in index
      }
      function createHeart() {
        const heart = document.createElement("div");
        heart.className = "fas fa-heart";
        heart.style.left = Math.random() * 90 + "vw";
        heart.style.animationDuration = Math.random() * 3 + 2 + "s";
        body.appendChild(heart);
      }
      setInterval(() => {
        const heartArr = document.querySelectorAll(".fa-heart");
        if (heartArr.length > 100) heartArr[0].remove();
      }, 100);
      function StartMarqueeL() {
        imglewat.style = "opacity:1;height:100px;";
        imglewat.start();
      }
      function akhiran() {
        Tombol.style = "transition:all .3s ease;opacity:0;transform: scale(.1);";
        setTimeout(() => { palingakhir.start(); }, 4000);
        bodyblur.style = "opacity:.4;animation:none";
        beneranblur.style = "-webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px)";
        wallpaper.style = "transform: scale(1.6)";
        pergeseran.style = "display:none";
        StartMarqueeL();
        idgeser.innerHTML = "";
        idkalimat.innerHTML = akhirkata2;
        idgeser.style = "opacity:1;transform: scale(1);font-size:16px;font-weight:400;margin:0 30px;margin-top:15px;";
        setTimeout(aksiakhir, 800);
      }
      function aksiakhir() {
        if (aa < akhirkata.length) {
          idgeser.innerHTML += akhirkata.charAt(aa);
          aa++;
          setTimeout(aksiakhir, 65);
        } else {
          idkalimat.style = "opacity:1;transform: scale(1);font-size:16px;margin-top:20px";
          setTimeout(showpalingakhir, 1100);
        }
      }
      function showpalingakhir() {
        palingakhir.style = "opacity:1;transform: scale(1);font-size:16px;margin-top:20px";
        setTimeout(tombol, 4000);
      }

      // Transition function
      function switchView() {
        IndexContent.style.display = "none";
        PesanContent.style.display = "block";
        wallpaper.src = "img/Background2.jpg";
        wallpaper.style.transform = "scale(1)";
        bodyblur.style = "opacity:1; animation:none;";
        beneranblur.style = "-webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px)";
        pertama2();
      }

      // Pesan functions (Renamed)
      let katangetik, katangetik2;
      let pesan1, pesan2, pesan3, pesan4;

      function showDiv2() {
        Content2.style = "opacity:1;margin-top:15vh;";
        ket.style = "margin-top:30px";
      }
      function memulai2() {
        suratin.style = "transition:all 1s ease;transform:scale(.1);opacity:0";
        ket.style = "transition:all 1s ease;transform:scale(.1);opacity:0";
        setTimeout(pesan_seq, 700);
      }
      function kpemb2() {
        suratin.style = "display:none";
